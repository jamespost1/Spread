name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Unit tests with coverage
        run: npm run coverage

      - name: Build extension
        run: npm run build

      - name: Verify the built extension is loadable
        run: node scripts/verify-build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          retention-days: 14

  eval:
    name: Match-cascade eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Runs the deterministic stage only, so it needs no credentials and costs
      # nothing. It fails the build if match precision regresses below 90% --
      # a false "same product" shows a shopper the wrong price.
      - name: Heuristic baseline
        run: npm run eval

  worker:
    name: Worker checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm ci --prefix worker

      - name: Type-check the Worker bundle
        run: npx --prefix worker wrangler deploy --dry-run --outdir /tmp/worker-build
        working-directory: worker
