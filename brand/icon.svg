<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Spread mark: three prices for one product, the lowest called out.
       Bar lengths encode the spread; the green bar is the best price. -->
  <rect width="128" height="128" rx="28" fill="#101614"/>
  <rect x="26" y="34" width="76" height="13" rx="6.5" fill="#64736D"/>
  <rect x="26" y="57.5" width="58" height="13" rx="6.5" fill="#64736D"/>
  <rect x="26" y="81" width="34" height="13" rx="6.5" fill="#4ADE80"/>
</svg>
