name = "spread-api"
main = "src/index.js"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# Public, non-secret configuration.
[vars]
# Hard ceiling on LLM adjudication calls per UTC day. At roughly $0.0017 per
# batched call, 200 is about $0.34/day worst case -- and the verdict cache means
# real usage sits far below the cap. Raise deliberately.
ADJUDICATION_DAILY_LIMIT = "200"
# Serper calls per UTC day -- every one of them, which is the point.
#
# This counter used to cover only the Google Shopping lookup, while each
# comparison went on to make up to twelve more: a URL resolution and a page
# read for each of the six offers it considers. Those were never counted, so
# "250" licensed roughly 3,250 calls a day and the free 2,500 grant could be
# gone inside one. The counter now covers resolution and page reads too, and a
# cache hit never draws on it.
#
# 400/day is therefore a real ceiling of about 30 cold comparisons, with
# cached ones unlimited on top. Worst case is 400 * $0.001 = $0.40/day once
# the free grant is spent. Watch `used` on /health and tune: too low and
# comparisons silently stop resolving, since an exhausted budget degrades by
# dropping offers rather than erroring.
SHOPPING_DAILY_LIMIT = "400"
# Third-party marketplace listings are excluded by default: their price cannot
# be verified, the seller is not the named retailer, and no page shows that
# specific offer. Set to "true" to include them.
INCLUDE_MARKETPLACE = "false"
ADJUDICATOR_MODEL = "claude-haiku-4-5"
# The published extension. Chrome bypasses CORS for the service worker's own
# fetches because this Worker's host is in the extension's host_permissions, so
# narrowing this cannot break a live install -- what it stops is an arbitrary
# web page calling the Worker from a browser and spending the API budget.
ALLOWED_ORIGIN = "chrome-extension://meflkmgahllegjeppnoolljigmbkkofi"

# Shared cache: offers (6h), match verdicts (90d), OAuth tokens, budget counters.
[[kv_namespaces]]
binding = "SPREAD_KV"
id = "bcc63dff6dbd4d0a958215a26646f860"

# Secrets -- set with `wrangler secret put <NAME>`, never committed:
#   SERPER_API_KEY       https://serper.dev/ (Google Shopping; 2,500 free, then
#                        ~$0.001/query -- the broad-coverage price source)
#   BESTBUY_API_KEY      https://developer.bestbuy.com/
#   EBAY_CLIENT_ID       https://developer.ebay.com/ (Browse API keyset)
#   EBAY_CLIENT_SECRET
#   ANTHROPIC_API_KEY    https://console.anthropic.com/ (optional -- without it
#                        the cascade runs heuristics-only and stays free)
#   EBAY_VERIFICATION_TOKEN  Any 32-80 char alphanumeric string you invent. Paste
#                        the same value into eBay's developer console alongside
#                        the notification endpoint URL.

# Must match the notification URL registered with eBay exactly -- it is part of
# the verification hash. Set after the Worker has its final URL.
# EBAY_NOTIFICATION_ENDPOINT = "https://spread-api.<subdomain>.workers.dev/ebay/account-deletion" 
